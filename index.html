<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dino Run</title>
<style>
  :root { --bg: #f7f7f7; --fg: #535353; --muted: #8a8a8a; }
  body.night { --bg: #1f1f21; --fg: #e3e3e3; --muted: #9a9a9a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background-color .8s, color .8s;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  main {
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 760px; }
  .msg h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 12px; }
  .msg p, .msg li { color: var(--muted); font-size: .95rem; line-height: 1.6; margin: 0; }
  .msg ul { margin: 4px 0 12px; padding-left: 22px; }
  .code { font-size: .8rem !important; letter-spacing: .02em; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); margin-bottom: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d93025; }
  .status.online .dot { background: #1e8e3e; }
  canvas {
    display: block; width: 100%; height: auto; margin-top: 28px;
    image-rendering: pixelated; touch-action: manipulation; cursor: pointer;
    transition: filter .8s;
  }
  body.night canvas { filter: invert(1); }
  .keys { margin-top: 14px !important; text-align: center; font-size: .8rem !important; }
  kbd {
    font-family: inherit; font-size: .75rem; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--muted); color: var(--fg);
  }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Офлайн</span></div>
    <div class="msg">
      <h1>Интернэт холболт байхгүй байна</h1>
      <p>Дараах зүйлсийг шалгаад үзээрэй:</p>
      <ul>
        <li>Сүлжээний кабель, модем, роутераа шалгах</li>
        <li>Wi-Fi сүлжээндээ дахин холбогдох</li>
      </ul>
      <p class="code">ERR_INTERNET_DISCONNECTED</p>
    </div>
    <canvas id="game" width="1200" height="320" aria-label="Dino game"></canvas>
    <p class="keys"><kbd>Space</kbd> / <kbd>↑</kbd> үсрэх &nbsp;·&nbsp; <kbd>↓</kbd> бөхийх &nbsp;·&nbsp; <kbd>M</kbd> дуу &nbsp;·&nbsp; утсан дээр дэлгэц товш</p>
  </div>
</main>

<script>
(() => {
  // ---------- Setup ----------
  const W = 600, H = 160, S = 2;          // logical size, internal resolution multiplier
  const P = 2;                            // sprite pixel size
  const GROUND_Y = 132;                   // y of the ground line
  const FOOT_Y = GROUND_Y + 4;            // where feet / cactus bottoms rest
  const DINO_X = 40;
  const GRAVITY = 0.6, JUMP_V = -10.5;
  const START_SPEED = 6, MAX_SPEED = 13, ACCEL = 0.0012;
  const COLOR = '#535353', CLOUD = '#d6d6d6';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.scale(S, S);

  // ---------- Sprites ('#' = pixel) ----------
  const DINO_TOP = [
    '          ######## ',
    '         ## #######',
    '         ##########',
    '         ##########',
    '         #####     ',
    '         ########  ',
    '#       #####      ',
    '#     #######      ',
    '##   ##########    ',
    '###  ######## #    ',
    '#############      ',
    '############       ',
    ' ##########        ',
    '  ########         ',
  ];
  const DINO_DEAD_EYE = ['         #   ######', '         # # ######', '         #   ######'];
  const LEGS = {
    stand: ['   ###  ##  ', '   ##    #  ', '   #     #  ', '   ##    ## '],
    a:     ['   ###  ##  ', '   ##    ## ', '   #        ', '   ##       '],
    b:     ['   ##  ###  ', '   #   ##   ', '        #   ', '        ##  '],
  };
  const DUCK_BODY = [
    '                   ######## ',
    '#       ########  ## #######',
    '##    ##################### ',
    '########################### ',
    ' ###################  ##### ',
    '  ################## ####   ',
    '   ##############          ',
  ];
  const DUCK_LEGS = {
    a: ['    ##  ###    ', '    #     ##   ', '    ##         '],
    b: ['    ###  ##    ', '     ##   #    ', '          ##   '],
  };
  const CACTUS = [
    '    ##    ',
    '   ####   ',
    '   ####   ',
    '   ####  #',
    '#  ####  #',
    '#  #### ##',
    '## #### ##',
    '## #######',
    '## ###### ',
    '#######   ',
    ' ######   ',
    '   ####   ',
    '   ####   ',
    '   ####   ',
    '   ####   ',
    '   ####   ',
    '   ####   ',
  ];
  const BIRD = [
    [ // wings up
      '      #               ',
      '      ##              ',
      '      ###             ',
      '   ## ####            ',
      '  ### #####           ',
      ' ###############      ',
      '######################',
      '      ############    ',
      '       #######        ',
    ],
    [ // wings down
      '                      ',
      '                      ',
      '   ##                 ',
      '  ###                 ',
      ' ###############      ',
      '######################',
      '      ############    ',
      '       #######        ',
      '       ####           ',
      '       ###            ',
      '       ##             ',
    ],
  ];
  const CLOUD_ROWS = [
    '         ######        ',
    '       ##      ##      ',
    '    ###          ##    ',
    '  ##               ### ',
    ' #                    #',
    '#######################',
  ];

  const widthOf = rows => Math.max(...rows.map(r => r.length));
  function drawRows(rows, x, y, p = P, color = COLOR) {
    ctx.fillStyle = color;
    x = Math.round(x); y = Math.round(y);
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        if (row[c] !== '#') continue;
        let e = c;
        while (row[e] === '#') e++;
        ctx.fillRect(x + c * p, y + r * p, (e - c) * p, p);
        c = e;
      }
    }
  }

  // ---------- Sound ----------
  let actx = null, muted = false;
  function beep(freq, dur, { type = 'square', vol = 0.04, to = null, delay = 0 } = {}) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* audio unavailable */ }
  }
  const sfx = {
    jump: () => beep(520, 0.09, { to: 820 }),
    point: () => { beep(880, 0.07); beep(1320, 0.12, { delay: 0.08 }); },
    die: () => beep(220, 0.3, { type: 'sawtooth', vol: 0.05, to: 60 }),
  };

  // ---------- State ----------
  let hi = 0;
  try { hi = +localStorage.getItem('dino-hi') || 0; } catch (e) {}

  let state = 'idle';            // idle | running | over
  let speed, distance, obstacles, overAt, flashUntil, lastMilestone;
  const dino = { y: 0, vy: 0, jumping: false, ducking: false, fastFall: false, legT: 0 };
  let clouds = [{ x: 420, y: 30 }, { x: 180, y: 55 }];
  let groundX = 0;
  const bumps = [];
  for (let x = 0; x < 1200; x += 8 + Math.random() * 30) {
    bumps.push({ x, y: GROUND_Y + 3 + Math.floor(Math.random() * 6), w: 1 + Math.floor(Math.random() * 3) });
  }

  function reset() {
    speed = START_SPEED; distance = 0; obstacles = [];
    dino.y = 0; dino.vy = 0; dino.jumping = false; dino.fastFall = false;
    flashUntil = 0; lastMilestone = 0;
    document.body.classList.remove('night');
  }
  reset();

  const score = () => Math.floor(distance * 0.025);
  const rand = (a, b) => a + Math.random() * (b - a);

  function start() {
    reset();
    state = 'running';
    jump();
  }

  function jump() {
    if (state !== 'running' || dino.jumping) return;
    dino.jumping = true; dino.vy = JUMP_V; dino.fastFall = false;
    sfx.jump();
  }

  function die() {
    state = 'over'; overAt = performance.now();
    sfx.die();
    if (score() > hi) {
      hi = score();
      try { localStorage.setItem('dino-hi', hi); } catch (e) {}
    }
  }

  // ---------- Obstacles ----------
  function spawn() {
    let o;
    if (speed > 8.5 && Math.random() < 0.28) {
      const lift = [30, 48, 76][Math.floor(Math.random() * 3)];  // low: jump, mid: duck/jump, high: run under
      o = { type: 'bird', x: W, w: widthOf(BIRD[0]) * P, h: 10 * P, y: FOOT_Y - lift, t: 0, extra: rand(-0.6, 0.6) };
    } else {
      const big = Math.random() < 0.45;
      const p = big ? 3 : 2;
      const maxN = speed > 9.5 ? 3 : 2;
      const n = 1 + Math.floor(Math.random() * maxN);
      const cw = widthOf(CACTUS) * p;
      const h = CACTUS.length * p;
      o = { type: 'cactus', x: W, n, p, cw, w: cw * n, h, y: FOOT_Y - h };
    }
    o.gap = speed * rand(30, 55) + 100;
    obstacles.push(o);
  }

  function dinoBoxes() {
    const top = FOOT_Y - dino.y;
    if (dino.ducking && !dino.jumping) {
      const h = (DUCK_BODY.length + 3) * P;
      return [{ x: DINO_X + 2 * P, y: top - h + P, w: 25 * P, h: 7 * P }];
    }
    const h = (DINO_TOP.length + 4) * P;
    const y0 = top - h;
    return [
      { x: DINO_X + 9 * P + 1, y: y0 + 1, w: 10 * P - 2, h: 6 * P },   // head
      { x: DINO_X + 2 * P, y: y0 + 7 * P, w: 12 * P, h: 9 * P },       // body
      { x: DINO_X + 3 * P, y: y0 + 16 * P, w: 8 * P, h: 2 * P - 2 },   // legs
    ];
  }

  function obstacleBox(o) {
    if (o.type === 'bird') return { x: o.x + 3, y: o.y + 6, w: o.w - 8, h: o.h - 8 };
    return { x: o.x + 4, y: o.y + 3, w: o.w - 8, h: o.h - 3 };
  }

  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // ---------- Update ----------
  function update(f, dt) {
    speed = Math.min(MAX_SPEED, speed + ACCEL * f);
    const dx = speed * f;
    distance += dx;
    groundX = (groundX + dx) % 1200;
    dino.legT += dt;

    if (dino.jumping) {
      dino.vy += GRAVITY * (dino.fastFall ? 3 : 1) * f;
      dino.y -= dino.vy * f;
      if (dino.y <= 0) { dino.y = 0; dino.vy = 0; dino.jumping = false; dino.fastFall = false; }
    }

    for (const o of obstacles) {
      o.x -= o.type === 'bird' ? (speed + o.extra) * f : dx;
      if (o.type === 'bird') o.t += dt;
    }
    obstacles = obstacles.filter(o => o.x + o.w > -10);
    const last = obstacles[obstacles.length - 1];
    if (!last || last.x + last.w + last.gap < W) spawn();

    const boxes = dinoBoxes();
    for (const o of obstacles) {
      const ob = obstacleBox(o);
      if (boxes.some(b => hit(b, ob))) { die(); break; }
    }

    const s = score();
    const milestone = Math.floor(s / 100);
    if (milestone > lastMilestone) {
      lastMilestone = milestone;
      flashUntil = performance.now() + 900;
      sfx.point();
    }
    document.body.classList.toggle('night', Math.floor(s / 700) % 2 === 1);

    updateClouds(f);
  }

  function updateClouds(f) {
    for (const c of clouds) c.x -= speed * 0.15 * f;
    clouds = clouds.filter(c => c.x > -60);
    const lastC = clouds[clouds.length - 1];
    if (!lastC || lastC.x < W - rand(120, 400)) clouds.push({ x: W + 10, y: rand(15, 70) });
  }

  // ---------- Render ----------
  const pad = n => String(n).padStart(5, '0');

  function render(now) {
    ctx.clearRect(0, 0, W, H);

    for (const c of clouds) drawRows(CLOUD_ROWS, c.x, c.y, 2, CLOUD);

    // ground
    ctx.fillStyle = COLOR;
    ctx.fillRect(0, GROUND_Y, W, 1);
    for (const b of bumps) {
      let x = b.x - groundX;
      if (x < 0) x += 1200;
      if (x < W) ctx.fillRect(Math.round(x), b.y, b.w, 1);
    }

    // obstacles
    for (const o of obstacles) {
      if (o.type === 'bird') {
        const fr = BIRD[Math.floor(o.t / 160) % 2];
        drawRows(fr, o.x, o.y - (fr.length - 9) * P + (fr === BIRD[1] ? 2 * P : 0));
      } else {
        for (let i = 0; i < o.n; i++) drawRows(CACTUS, o.x + i * o.cw, o.y, o.p);
      }
    }

    drawDino();

    // score
    ctx.fillStyle = COLOR;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    const flashing = now < flashUntil && Math.floor((flashUntil - now) / 150) % 2 === 0;
    const scoreText = flashing ? pad(lastMilestone * 100) : pad(score());
    const showScore = !(now < flashUntil && Math.floor((flashUntil - now) / 150) % 2 === 1);
    ctx.globalAlpha = 0.7;
    if (hi) ctx.fillText(`HI ${pad(hi)}       `, W - 10, 10);
    ctx.globalAlpha = 1;
    if (state !== 'idle' && showScore) ctx.fillText(scoreText, W - 10, 10);

    ctx.textAlign = 'center';
    if (state === 'idle') {
      ctx.font = '11px "Courier New", monospace';
      ctx.fillText('SPACE дарж эсвэл товшиж эхлэнэ үү', W / 2, 60);
    } else if (state === 'over') {
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.fillText('G A M E   O V E R', W / 2, 45);
      drawRestart(W / 2, 85);
    }
  }

  function drawDino() {
    const bottom = FOOT_Y - dino.y;
    const run = state === 'running' && !dino.jumping;
    const frame = Math.floor(dino.legT / 100) % 2 ? 'a' : 'b';

    if (dino.ducking && !dino.jumping && state !== 'over') {
      const legs = DUCK_LEGS[frame];
      const top = bottom - (DUCK_BODY.length + legs.length) * P;
      drawRows(DUCK_BODY, DINO_X, top);
      drawRows(legs, DINO_X, top + DUCK_BODY.length * P);
      return;
    }
    const legs = run ? LEGS[frame] : LEGS.stand;
    const top = bottom - (DINO_TOP.length + legs.length) * P;
    drawRows(DINO_TOP, DINO_X, top);
    drawRows(legs, DINO_X, top + DINO_TOP.length * P);
    if (state === 'over') {
      // dead eye: clear head area and redraw with a wide eye
      ctx.clearRect(DINO_X + 9 * P, top + 0 * P + P, 10 * P, 3 * P);
      drawRows(DINO_DEAD_EYE, DINO_X, top + P);
    }
  }

  function drawRestart(cx, cy) {
    ctx.strokeStyle = COLOR; ctx.fillStyle = COLOR; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 11, -Math.PI * 0.35, Math.PI * 1.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 4, cy - 17);
    ctx.lineTo(cx + 13, cy - 9);
    ctx.lineTo(cx + 2, cy - 5);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- Loop ----------
  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min(50, t - lastT);
    lastT = t;
    if (state === 'running') update(dt / 16.667, dt);
    else if (state === 'idle') updateClouds(0.3 * dt / 16.667);
    render(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- Input ----------
  function press() {
    if (state === 'idle') start();
    else if (state === 'running') jump();
    else if (performance.now() - overAt > 500) start();
  }

  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat || state === 'running') press();
    } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
      e.preventDefault();
      if (state !== 'running') return;
      if (dino.jumping) dino.fastFall = true;
      else dino.ducking = true;
    } else if (e.code === 'KeyM') {
      muted = !muted;
    }
  });
  window.addEventListener('keyup', e => {
    if (['ArrowDown', 'KeyS'].includes(e.code)) { dino.ducking = false; dino.fastFall = false; }
  });

  // Touch: tap = jump, swipe down / hold lower half = duck
  let touchY = null;
  document.addEventListener('touchstart', e => {
    if (e.target.closest('a')) return;
    e.preventDefault();
    touchY = e.touches[0].clientY;
    press();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (touchY !== null && e.touches[0].clientY - touchY > 30 && state === 'running') {
      if (dino.jumping) dino.fastFall = true; else dino.ducking = true;
    }
  }, { passive: true });
  document.addEventListener('touchend', () => { touchY = null; dino.ducking = false; });
  canvas.addEventListener('mousedown', press);

  // ---------- Online status ----------
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  function updateStatus() {
    status.classList.toggle('online', navigator.onLine);
    statusText.textContent = navigator.onLine ? 'Онлайн (гэхдээ тоглож болно 😄)' : 'Офлайн';
  }
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
  updateStatus();
})();
</script>
</body>
</html>
